<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevGigs — Developer Freelance & Job Board Hub (Interactive Preview)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-base: #07090e;
      --bg-surface: #0e131f;
      --bg-surface-elevated: #141c2e;
      --bg-card: rgba(18, 25, 41, 0.72);
      --bg-card-hover: rgba(26, 36, 60, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-focus: #38bdf8;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-display: 'Outfit', sans-serif;
      --font-code: 'JetBrains Mono', monospace;
      --radius-sm: 8px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
      --container-max: 1180px;
      --container-padding: clamp(1.25rem, 3.5vw, 2.5rem);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main); background-color: var(--bg-base); color: var(--text-primary);
      line-height: 1.6; min-height: 100vh; overflow-x: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.07) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 60%, rgba(16, 185, 129, 0.04) 0px, transparent 60%);
      background-attachment: fixed;
    }
    h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.02em; }
    button { font-family: var(--font-main); cursor: pointer; border: none; background: none; transition: all 0.2s; }
    input, textarea, select {
      font-family: var(--font-main); color: var(--text-primary); background: var(--bg-surface-elevated);
      border: 1px solid var(--border-medium); border-radius: var(--radius-md); padding: 0.8rem 1.1rem;
      font-size: 0.95rem; width: 100%; outline: none; transition: all 0.2s var(--ease-smooth);
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); background: #141c2e;
    }

    /* Nav */
    .devgigs-nav {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(14, 19, 31, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle); width: 100%;
    }
    .nav-inner {
      max-width: var(--container-max); margin: 0 auto;
      padding: 0.85rem var(--container-padding);
      display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; width: 100%;
    }
    .brand-wrapper { display: flex; align-items: center; gap: 0.8rem; cursor: pointer; }
    .brand-logo-icon { width: 38px; height: 38px; border-radius: var(--radius-md); background: linear-gradient(135deg, #38bdf8, #6366f1); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 800; color: white; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.35); }
    .brand-text { font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; }
    .brand-badge { background: rgba(56, 189, 248, 0.12); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.3); font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: var(--radius-full); }
    .nav-links-menu { display: flex; align-items: center; gap: 0.4rem; list-style: none; }
    .nav-link-btn { color: var(--text-secondary); font-weight: 500; font-size: 0.92rem; padding: 0.55rem 0.95rem; border-radius: var(--radius-md); display: flex; align-items: center; gap: 0.45rem; }
    .nav-link-btn:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.05); }
    .nav-link-btn.active { color: var(--accent-cyan); background: rgba(56, 189, 248, 0.1); font-weight: 600; box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.25); }
    .btn-ghost { color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; padding: 0.55rem 1.1rem; border-radius: var(--radius-md); border: 1px solid var(--border-medium); }
    .btn-ghost:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.08); }
    .btn-gradient-primary { color: #fff; font-size: 0.9rem; font-weight: 600; padding: 0.6rem 1.35rem; border-radius: var(--radius-md); background: linear-gradient(135deg, #0284c7, #2563eb, #6366f1); box-shadow: 0 4px 18px rgba(37, 99, 235, 0.35); display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn-gradient-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5); }

    /* Hero */
    .hero-stage { padding: 3.5rem var(--container-padding) 2.5rem; max-width: var(--container-max); margin: 0 auto; width: 100%; }
    .hero-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 2.5rem; align-items: center; }
    .hero-tag { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.4rem 1.1rem; border-radius: var(--radius-full); background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.22); color: var(--accent-cyan); font-size: 0.85rem; font-weight: 600; margin-bottom: 1.5rem; }
    .status-live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-emerald); box-shadow: 0 0 10px var(--accent-emerald); }
    .hero-headline { font-size: 3.2rem; font-weight: 800; line-height: 1.12; margin-bottom: 1.35rem; }
    .gradient-title-text { background: linear-gradient(135deg, #38bdf8, #818cf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-lead-text { font-size: 1.15rem; color: var(--text-secondary); line-height: 1.7; margin-bottom: 2rem; max-width: 600px; }
    .hero-search-box { background: var(--bg-surface); border: 1px solid var(--border-medium); border-radius: var(--radius-lg); padding: 0.5rem; display: flex; align-items: center; gap: 0.8rem; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); margin-bottom: 1.5rem; }
    .hero-search-box input { background: transparent; border: none; box-shadow: none; font-size: 1rem; }
    .preset-chip { background: rgba(255, 255, 255, 0.05); color: var(--text-secondary); padding: 0.25rem 0.7rem; border-radius: var(--radius-full); font-size: 0.8rem; border: 1px solid var(--border-subtle); cursor: pointer; }
    .preset-chip:hover { color: var(--accent-cyan); border-color: rgba(56, 189, 248, 0.4); }
    .hero-spotlight-card { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-medium); border-radius: var(--radius-xl); padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.7); }
    .spotlight-avatar { width: 52px; height: 52px; border-radius: var(--radius-md); background: linear-gradient(135deg, #6366f1, #38bdf8); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }

    /* Grid & Cards */
    .portal-main-area { max-width: var(--container-max); margin: 0 auto; padding: 1.5rem var(--container-padding) 5rem; width: 100%; }
    .portal-toolbar { background: var(--bg-surface); border: 1px solid var(--border-medium); border-radius: var(--radius-xl); padding: 1.35rem 1.75rem; margin-bottom: 2.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .category-tabs-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .category-tab-btn { padding: 0.5rem 1rem; border-radius: var(--radius-md); font-size: 0.88rem; font-weight: 600; color: var(--text-secondary); background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); }
    .category-tab-btn.active { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border-color: rgba(56, 189, 248, 0.5); }
    .status-count-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.85rem; border-radius: var(--radius-full); font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); border: 1px solid var(--border-subtle); }
    .status-count-btn.active { background: var(--text-primary); color: var(--bg-base); }
    .gigs-luxury-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1.5rem; }
    .luxury-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 1.75rem; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s; }
    .luxury-card:hover { transform: translateY(-5px); background: var(--bg-card-hover); border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .card-cat-badge { font-size: 0.75rem; font-weight: 700; color: var(--accent-cyan); background: rgba(56, 189, 248, 0.1); padding: 0.25rem 0.65rem; border-radius: var(--radius-sm); border: 1px solid rgba(56, 189, 248, 0.2); }
    .card-state-pill { font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); }
    .state-open { background: rgba(16, 185, 129, 0.12); color: var(--accent-emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .state-in-progress { background: rgba(245, 158, 11, 0.12); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .state-completed { background: rgba(99, 102, 241, 0.12); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); }
    .card-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.65rem; cursor: pointer; }
    .card-title:hover { color: var(--accent-cyan); }
    .tag-skill-chip { font-size: 0.75rem; font-family: var(--font-code); background: var(--bg-surface-elevated); color: #cbd5e1; padding: 0.25rem 0.6rem; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
    .budget-amount { font-family: var(--font-code); font-size: 1.25rem; font-weight: 700; color: var(--accent-emerald); }
    .btn-cycle-state { padding: 0.55rem 0.75rem; border-radius: var(--radius-md); font-size: 0.8rem; font-weight: 600; background: var(--bg-surface-elevated); color: var(--text-secondary); border: 1px solid var(--border-medium); }
    .btn-view-scope { padding: 0.55rem 0.75rem; border-radius: var(--radius-md); font-size: 0.8rem; font-weight: 600; background: rgba(56, 189, 248, 0.1); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.25); }
    .btn-delete-card { padding: 0.55rem 0.85rem; border-radius: var(--radius-md); color: var(--accent-rose); background: rgba(244, 63, 94, 0.08); border: 1px solid rgba(244, 63, 94, 0.2); font-weight: 600; font-size: 0.8rem; }

    /* Page Container & Layout */
    .page-container {
      width: 100%; max-width: var(--container-max); margin: 0 auto;
      padding: 2.5rem var(--container-padding) 6rem; box-sizing: border-box;
    }
    .page-header { text-align: center; margin-bottom: 3rem; }
    .page-badge { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent-cyan); background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.28); padding: 0.3rem 0.85rem; border-radius: var(--radius-full); margin-bottom: 1rem; }
    .page-title { font-size: clamp(2rem, 3.2vw, 2.75rem); font-weight: 800; line-height: 1.2; margin-bottom: 0.85rem; color: var(--text-primary); }
    .page-desc { font-size: 1.05rem; color: var(--text-secondary); max-width: 680px; margin: 0 auto; line-height: 1.7; }

    .about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.75rem; margin-bottom: 3.5rem; }
    .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.75rem; margin-bottom: 3.5rem; }
    .feature-box { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 2rem; transition: all 0.3s; }
    .feature-box:hover { transform: translateY(-4px); border-color: rgba(56, 189, 248, 0.35); background: var(--bg-card-hover); }
    .feature-icon { width: 50px; height: 50px; border-radius: var(--radius-md); background: var(--bg-surface-elevated); border: 1px solid var(--border-medium); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1.25rem; }
    .contact-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 2.5rem; align-items: start; }
    .contact-info-card { background: var(--bg-surface); border: 1px solid var(--border-medium); border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem; }
    .form-group { margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 0.45rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }

    /* Side Drawer */
    .drawer-backdrop { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(8px); z-index: 1500; display: flex; justify-content: flex-end; }
    .drawer-content { width: 100%; max-width: 620px; height: 100vh; background: var(--bg-surface); border-left: 1px solid var(--border-medium); padding: 2.5rem; overflow-y: auto; display: flex; flex-direction: column; }
    .drawer-close-btn { position: absolute; top: 1.5rem; right: 1.5rem; width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--bg-surface-elevated); border: 1px solid var(--border-medium); color: var(--text-secondary); font-size: 1.25rem; }

    /* Dashboard */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-bottom: 2.5rem; }
    .metric-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 1.5rem; }
    .metric-card .label { font-size: 0.82rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; }
    .metric-card .value { font-size: 2rem; font-weight: 800; font-family: var(--font-code); }
    .data-table-wrapper { background: var(--bg-surface); border: 1px solid var(--border-medium); border-radius: var(--radius-xl); overflow: hidden; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { background: var(--bg-surface-elevated); padding: 1rem 1.5rem; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .data-table td { padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--border-subtle); font-size: 0.92rem; }

    /* Footer */
    .luxury-footer { border-top: 1px solid var(--border-subtle); background: #06080e; padding: 4.5rem 0 2rem; margin-top: 4rem; width: 100%; }
    .footer-inner { max-width: var(--container-max); margin: 0 auto 3rem; padding: 0 var(--container-padding); display: grid; grid-template-columns: 1.5fr repeat(3, 1fr); gap: 2.5rem; width: 100%; box-sizing: border-box; }
    .footer-bottom-bar { max-width: var(--container-max); margin: 0 auto; padding: 2rem var(--container-padding) 0; border-top: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 0.85rem; width: 100%; box-sizing: border-box; }

    /* Toast */
    .toast-luxury { position: fixed; bottom: 2rem; right: 2rem; background: var(--bg-surface); border: 1px solid var(--accent-cyan); color: var(--text-primary); padding: 1rem 1.6rem; border-radius: var(--radius-md); box-shadow: 0 15px 35px rgba(0,0,0,0.7); z-index: 3000; display: flex; align-items: center; gap: 0.8rem; font-weight: 600; }

    @media (max-width: 1024px) {
      .hero-grid { grid-template-columns: 1fr; }
      .contact-layout { grid-template-columns: 1fr; }
      .footer-inner { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 820px) {
      .nav-links-menu { display: none; }
      .form-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .gigs-luxury-grid { grid-template-columns: 1fr; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .footer-inner { grid-template-columns: 1fr; }
      .footer-bottom-bar { flex-direction: column; gap: 0.75rem; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_GIGS = [
      {
        _id: "66f123456789abcdef000001",
        name: "Alex Rivera",
        email: "alex@techcorp.io",
        title: "Full-Stack React & Node.js Developer",
        category: "Full Stack",
        budget: "$3,200",
        skills: "React, Node.js, Express, MongoDB",
        age: 26,
        status: "Open",
        description: "Looking for an experienced developer to build a modern analytics dashboard with real-time charts and REST API endpoints. You will collaborate with our designer to implement clean components."
      },
      {
        _id: "66f123456789abcdef000002",
        name: "Elena Rostova",
        email: "elena@designhub.co",
        title: "UI/UX & Mobile App Redesign",
        category: "UI/UX Design",
        budget: "$1,800",
        skills: "Figma, Design Systems, Mobile UI",
        age: 28,
        status: "In-Progress",
        description: "Revamp our SaaS mobile experience with high-fidelity micro-interactions, sleek dark mode, and user journey optimization."
      },
      {
        _id: "66f123456789abcdef000003",
        name: "Marcus Chen",
        email: "marcus@cloudops.net",
        title: "DevOps & Docker Deployment Pipeline",
        category: "DevOps",
        budget: "$2,500",
        skills: "Docker, Kubernetes, AWS, CI/CD",
        age: 31,
        status: "Completed",
        description: "Set up automated GitHub Actions CI/CD workflows, containerized backend services, and multi-region deployment."
      },
      {
        _id: "66f123456789abcdef000004",
        name: "Sarah Jenkins",
        email: "sarah@aiinnovate.org",
        title: "AI Integration & LangChain Agent",
        category: "AI / ML",
        budget: "$4,200",
        skills: "Python, FastAPI, OpenAI, LangChain",
        age: 29,
        status: "Open",
        description: "Build an autonomous customer support agent integrating with proprietary knowledge bases and vector search retrieval."
      }
    ];

    function App() {
      const [currentRoute, setCurrentRoute] = useState('home');
      const [gigs, setGigs] = useState(INITIAL_GIGS);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCat, setSelectedCat] = useState('All');
      const [selectedStatus, setSelectedStatus] = useState('All');
      const [drawerGig, setDrawerGig] = useState(null);
      const [toast, setToast] = useState(null);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [user, setUser] = useState(null);

      // Post Gig form state
      const [newGig, setNewGig] = useState({
        title: '', name: '', email: '', budget: '$2,500',
        category: 'Full Stack', skills: 'React, Node.js, Express, MongoDB',
        description: 'Need an experienced engineer to take full ownership of our feature sprint.',
        status: 'Open'
      });

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Fetch from API if available
      useEffect(() => {
        fetch('http://localhost:5000/getall')
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) setGigs(data);
          })
          .catch(() => {});
      }, []);

      const handleCreate = (e) => {
        e.preventDefault();
        const created = { _id: 'gig_' + Date.now(), ...newGig };
        fetch('http://localhost:5000/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newGig)
        }).catch(() => {});

        setGigs([created, ...gigs]);
        showToast('Contract published to MongoDB!');
        setCurrentRoute('gigs');
      };

      const handleUpdate = (id, nextStatus) => {
        fetch(`http://localhost:5000/update/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: nextStatus })
        }).catch(() => {});

        setGigs(gigs.map(g => g._id === id ? { ...g, status: nextStatus } : g));
        if (drawerGig && drawerGig._id === id) setDrawerGig({ ...drawerGig, status: nextStatus });
        showToast(`Status updated to "${nextStatus}"!`);
      };

      const handleDelete = (id) => {
        if (!confirm('Remove this contract from MongoDB collection?')) return;
        fetch(`http://localhost:5000/delete/${id}`, { method: 'DELETE' }).catch(() => {});
        setGigs(gigs.filter(g => g._id !== id));
        if (drawerGig && drawerGig._id === id) setDrawerGig(null);
        showToast('Contract deleted!');
      };

      const getNext = (s) => s === 'Open' ? 'In-Progress' : s === 'In-Progress' ? 'Completed' : 'Open';

      const filteredGigs = gigs.filter(g => {
        const text = `${g.title} ${g.skills} ${g.name} ${g.category}`.toLowerCase();
        const matchSearch = !searchTerm || text.includes(searchTerm.toLowerCase());
        const matchCat = selectedCat === 'All' || g.category.toLowerCase() === selectedCat.toLowerCase();
        const matchStatus = selectedStatus === 'All' || g.status.toLowerCase() === selectedStatus.toLowerCase();
        return matchSearch && matchCat && matchStatus;
      });

      const totalVol = gigs.reduce((acc, g) => acc + (parseInt(g.budget.replace(/[^0-9]/g, '')) || 0), 0);

      return (
        <div>
          {/* NAV */}
          <nav className="devgigs-nav">
            <div className="nav-inner">

              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                  <div className="brand-logo-icon" style={{ width: '30px', height: '30px', fontSize: '1rem' }}>⚡</div>
                  <span style={{ fontSize: '1.25rem', fontWeight: 800 }}>DevGigs</span>
                  <span className="brand-badge">CA-03</span>
                </div>
                <p style={{ color: '#94a3b8', fontSize: '0.9rem', marginTop: '0.8rem' }}>The next-generation freelance job board for software engineers.</p>
              </div>
              <div>
                <h4 style={{ marginBottom: '1rem' }}>Routes</h4>
                <p><button onClick={() => setCurrentRoute('home')} style={{ color: '#94a3b8', marginBottom: '0.4rem' }}>Explore</button></p>
                <p><button onClick={() => setCurrentRoute('gigs')} style={{ color: '#94a3b8', marginBottom: '0.4rem' }}>Job Board</button></p>
                <p><button onClick={() => setCurrentRoute('post-gig')} style={{ color: '#94a3b8', marginBottom: '0.4rem' }}>Post a Gig</button></p>
                <p><button onClick={() => setCurrentRoute('dashboard')} style={{ color: '#94a3b8' }}>Dashboard</button></p>
              </div>
              <div>
                <h4 style={{ marginBottom: '1rem' }}>Tech Stack</h4>
                <p style={{ color: '#94a3b8', fontSize: '0.88rem' }}>• React 18 / Vite</p>
                <p style={{ color: '#94a3b8', fontSize: '0.88rem' }}>• Express & Node.js</p>
                <p style={{ color: '#94a3b8', fontSize: '0.88rem' }}>• MongoDB Native</p>
              </div>
              <div>
                <h4 style={{ marginBottom: '1rem' }}>Course Info</h4>
                <p style={{ color: '#94a3b8', fontSize: '0.88rem' }}>SIT Sec B - CA-03</p>
                <p style={{ color: '#94a3b8', fontSize: '0.88rem' }}>Database: sitSecB</p>
              </div>
            </div>
          </footer>

          {/* DRAWER SLIDE-OVER */}
          {drawerGig && (
            <div className="drawer-backdrop" onClick={() => setDrawerGig(null)}>
              <div className="drawer-content" onClick={e => e.stopPropagation()}>
                <button className="drawer-close-btn" onClick={() => setDrawerGig(null)}>&times;</button>
                <span className="card-cat-badge" style={{ alignSelf: 'flex-start', marginBottom: '0.8rem' }}>{drawerGig.category}</span>
                <h2 style={{ fontSize: '1.75rem', marginBottom: '1.2rem' }}>{drawerGig.title}</h2>
                <div style={{ background: 'var(--bg-surface-elevated)', padding: '1rem', borderRadius: '12px', display: 'flex', justifyContent: 'space-between', marginBottom: '1.5rem' }}>
                  <div><span style={{ fontSize: '0.75rem', color: '#94a3b8' }}>BUDGET</span><div style={{ color: '#10b981', fontSize: '1.5rem', fontWeight: 800 }}>{drawerGig.budget}</div></div>
                  <div><span style={{ fontSize: '0.75rem', color: '#94a3b8' }}>STATUS</span><div style={{ color: '#38bdf8', fontWeight: 700 }}>● {drawerGig.status}</div></div>
                </div>
                <h4 style={{ marginBottom: '0.5rem' }}>Project Scope</h4>
                <p style={{ color: '#94a3b8', lineHeight: 1.7, marginBottom: '1.5rem' }}>{drawerGig.description}</p>
                <h4 style={{ marginBottom: '0.5rem' }}>Required Tech Stack</h4>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem', marginBottom: '1.5rem' }}>
                  {drawerGig.skills.split(',').map((s, idx) => (
                    <span key={idx} className="tag-skill-chip">{s.trim()}</span>
                  ))}
                </div>
                <div style={{ marginTop: 'auto', borderTop: '1px solid var(--border-medium)', paddingTop: '1.2rem' }}>
                  <button className="btn-gradient-primary" style={{ width: '100%', justifyContent: 'center', padding: '0.85rem' }} onClick={() => { showToast('Proposal submitted!'); setDrawerGig(null); }}>
                    Submit Proposal for this Contract ➔
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* AUTH MODAL */}
          {isAuthOpen && (
            <div className="drawer-backdrop" style={{ justifyContent: 'center', alignItems: 'center' }} onClick={() => setIsAuthOpen(false)}>
              <div style={{ background: 'var(--bg-surface)', padding: '2.5rem', borderRadius: '24px', maxWidth: '450px', width: '100%', border: '1px solid var(--border-medium)' }} onClick={e => e.stopPropagation()}>
                <h2 style={{ marginBottom: '1.5rem' }}>Sign In with JWT Auth</h2>
                <form onSubmit={e => { e.preventDefault(); setUser({ name: 'Alex Developer' }); setIsAuthOpen(false); showToast('Authenticated with JWT!'); }}>
                  <div style={{ marginBottom: '1rem' }}><input type="email" placeholder="name@domain.com" required /></div>
                  <div style={{ marginBottom: '1.5rem' }}><input type="password" placeholder="••••••••" required /></div>
                  <button type="submit" className="btn-gradient-primary" style={{ width: '100%', justifyContent: 'center', padding: '0.85rem' }}>Sign In & Verify JWT</button>
                </form>
              </div>
            </div>
          )}

          {/* TOAST */}
          {toast && <div className="toast-luxury"><span>🔔</span><span>{toast}</span></div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
